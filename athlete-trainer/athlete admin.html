<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运动员训练管理系统 · Athlete OS</title>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">⚡</div>
      <div class="brand-text">
        <div class="brand-name">运动员管理系统</div>
        <div class="brand-sub">Athlete OS · Sprint &amp; Jump</div>
      </div>
    </div>
    <nav class="nav" id="mainNav">
      <button class="nav-item active" data-view="dashboard"><span>📊</span>总览</button>
      <button class="nav-item" data-view="calendar"><span>📅</span>日历回看</button>
      <div class="nav-group">身体监控</div>
      <button class="nav-item" data-view="sleep"><span>😴</span>睡眠记录</button>
      <button class="nav-item" data-view="heart"><span>❤️</span>静息心率</button>
      <button class="nav-item" data-view="body"><span>📏</span>身体围度</button>
      <div class="nav-group">训练</div>
      <button class="nav-item" data-view="training"><span>🏃</span>专项训练</button>
      <button class="nav-item" data-view="analysis"><span>🔬</span>力速 / RSI 分析</button>
      <button class="nav-item" data-view="plans"><span>🗓️</span>训练计划</button>
      <div class="nav-group">系统</div>
      <button class="nav-item" data-view="data"><span>💾</span>数据管理</button>
    </nav>
    <div class="sidebar-foot">
      <div class="ath-mini" id="athMini"></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="page-title-wrap">
        <h1 id="pageTitle">总览</h1>
        <div class="page-sub" id="pageSub">最近 7 天训练与恢复状态</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" id="btnQuickAdd">＋ 快速记录</button>
        <button class="btn btn-primary" id="btnExportPdf">导出 PDF 报告</button>
      </div>
    </header>

    <div class="view active" id="view-dashboard"><div class="page-content" id="content-dashboard"></div></div>
    <div class="view" id="view-calendar"><div class="page-content" id="content-calendar"></div></div>
    <div class="view" id="view-sleep"><div class="page-content" id="content-sleep"></div></div>
    <div class="view" id="view-heart"><div class="page-content" id="content-heart"></div></div>
    <div class="view" id="view-training"><div class="page-content" id="content-training"></div></div>
    <div class="view" id="view-body"><div class="page-content" id="content-body"></div></div>
    <div class="view" id="view-analysis"><div class="page-content" id="content-analysis"></div></div>
    <div class="view" id="view-plans"><div class="page-content" id="content-plans"></div></div>
    <div class="view" id="view-data"><div class="page-content" id="content-data"></div></div>
  </main>
</div>

<div id="quickAddMenu" class="quick-menu hidden">
  <button data-qa="sleep">😴 睡眠记录</button>
  <button data-qa="heart">❤️ 静息心率</button>
  <button data-qa="training">🏃 专项训练</button>
  <button data-qa="body">📏 身体围度</button>
  <button data-qa="profile">👤 运动员档案</button>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="vendor/pdf-lib.min.js"></script>
<script src="js/store.js"></script>
<script src="js/charts.js"></script>
<script src="js/analytics.js"></script>
<script src="js/ui.js"></script>
<script src="js/views.js"></script>
<script src="js/analysis-views.js"></script>
<script src="js/pdf.js"></script>
<script src="js/main.js"></script>
</body>
</html>
